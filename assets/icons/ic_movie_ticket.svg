<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Ticket body -->
  <rect x="16" y="62" width="168" height="76" rx="10" fill="currentColor" opacity="0.5"/>
  <!-- Top border accent stripe -->
  <rect x="16" y="58" width="168" height="10" rx="5" fill="currentColor" opacity="0.35"/>
  <!-- Bottom border accent stripe -->
  <rect x="16" y="132" width="168" height="10" rx="5" fill="currentColor" opacity="0.35"/>
  <!-- Scalloped tear line notches (top) -->
  <circle cx="128" cy="62" r="9" fill="currentColor" opacity="0.12"/>
  <!-- Scalloped tear line notches (bottom) -->
  <circle cx="128" cy="138" r="9" fill="currentColor" opacity="0.12"/>
  <!-- Tear line dashed -->
  <line x1="128" y1="74" x2="128" y2="126" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.22"/>
  <!-- Left stub: inner rectangle frame -->
  <rect x="26" y="74" width="92" height="52" rx="6" fill="currentColor" opacity="0.14"/>
  <!-- Left stub: decorative double border -->
  <rect x="30" y="78" width="84" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.18"/>
  <!-- Left stub: centered diamond pattern -->
  <polygon points="72,86 82,96 72,106 62,96" fill="currentColor" opacity="0.2"/>
  <polygon points="72,90 78,96 72,102 66,96" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <!-- Left stub: small decorative circles -->
  <circle cx="46" cy="96" r="4" fill="currentColor" opacity="0.15"/>
  <circle cx="46" cy="96" r="2" fill="currentColor" opacity="0.1"/>
  <circle cx="98" cy="96" r="4" fill="currentColor" opacity="0.15"/>
  <circle cx="98" cy="96" r="2" fill="currentColor" opacity="0.1"/>
  <!-- Right stub: concentric circles -->
  <circle cx="154" cy="100" r="18" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
  <circle cx="154" cy="100" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.16"/>
  <circle cx="154" cy="100" r="6" fill="currentColor" opacity="0.18"/>
  <!-- Right stub: corner dots -->
  <circle cx="140" cy="80" r="2.5" fill="currentColor" opacity="0.15"/>
  <circle cx="168" cy="80" r="2.5" fill="currentColor" opacity="0.15"/>
  <circle cx="140" cy="120" r="2.5" fill="currentColor" opacity="0.15"/>
  <circle cx="168" cy="120" r="2.5" fill="currentColor" opacity="0.15"/>
  <!-- Right stub: barcode-style lines -->
  <rect x="140" y="126" width="2" height="10" rx="1" fill="currentColor" opacity="0.18"/>
  <rect x="144" y="126" width="1" height="10" rx="0.5" fill="currentColor" opacity="0.12"/>
  <rect x="147" y="126" width="3" height="10" rx="1" fill="currentColor" opacity="0.18"/>
  <rect x="152" y="126" width="1" height="10" rx="0.5" fill="currentColor" opacity="0.12"/>
  <rect x="155" y="126" width="2" height="10" rx="1" fill="currentColor" opacity="0.18"/>
  <rect x="159" y="126" width="1" height="10" rx="0.5" fill="currentColor" opacity="0.12"/>
  <rect x="162" y="126" width="2" height="10" rx="1" fill="currentColor" opacity="0.15"/>
</svg>
