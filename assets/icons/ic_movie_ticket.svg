<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Main ticket body -->
  <rect x="20" y="65" width="160" height="70" rx="8" fill="currentColor" opacity="0.5"/>
  <!-- Perforated divider line -->
  <line x1="130" y1="65" x2="130" y2="135" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" opacity="0.35"/>
  <!-- Left section (main) -->
  <!-- ADMIT ONE text area -->
  <rect x="32" y="78" width="88" height="44" rx="4" fill="currentColor" opacity="0.2"/>
  <!-- ADMIT text -->
  <text x="46" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="currentColor" opacity="0.45">ADMIT</text>
  <text x="48" y="114" font-family="sans-serif" font-size="11" font-weight="bold" fill="currentColor" opacity="0.45">ONE</text>
  <!-- Small star decorations -->
  <circle cx="88" cy="90" r="3" fill="currentColor" opacity="0.25"/>
  <circle cx="88" cy="108" r="3" fill="currentColor" opacity="0.25"/>
  <!-- Right stub section -->
  <!-- Number area -->
  <rect x="140" y="78" width="30" height="44" rx="3" fill="currentColor" opacity="0.2"/>
  <text x="147" y="106" font-family="sans-serif" font-size="18" font-weight="bold" fill="currentColor" opacity="0.4">#1</text>
  <!-- Semicircle notches at divider -->
  <circle cx="130" cy="65" r="10" fill="currentColor" opacity="0.15"/>
  <circle cx="130" cy="135" r="10" fill="currentColor" opacity="0.15"/>
  <!-- Top decorative stripe -->
  <rect x="20" y="62" width="160" height="6" rx="3" fill="currentColor" opacity="0.3"/>
  <!-- Bottom decorative stripe -->
  <rect x="20" y="132" width="160" height="6" rx="3" fill="currentColor" opacity="0.3"/>
</svg>