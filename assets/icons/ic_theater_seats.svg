<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Left seat back -->
  <rect x="16" y="70" width="48" height="55" rx="10" fill="currentColor" opacity="0.5"/>
  <!-- Left seat cushion -->
  <rect x="14" y="120" width="52" height="22" rx="6" fill="currentColor" opacity="0.6"/>
  <!-- Left armrest -->
  <rect x="10" y="95" width="10" height="40" rx="5" fill="currentColor" opacity="0.4"/>
  <!-- Left legs -->
  <rect x="22" y="142" width="5" height="22" rx="2" fill="currentColor" opacity="0.3"/>
  <rect x="52" y="142" width="5" height="22" rx="2" fill="currentColor" opacity="0.3"/>

  <!-- Center seat back (slightly taller) -->
  <rect x="74" y="62" width="52" height="60" rx="10" fill="currentColor" opacity="0.55"/>
  <!-- Center seat cushion -->
  <rect x="72" y="116" width="56" height="24" rx="6" fill="currentColor" opacity="0.65"/>
  <!-- Center armrests -->
  <rect x="68" y="88" width="10" height="42" rx="5" fill="currentColor" opacity="0.45"/>
  <rect x="122" y="88" width="10" height="42" rx="5" fill="currentColor" opacity="0.45"/>
  <!-- Center legs -->
  <rect x="82" y="140" width="5" height="24" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="112" y="140" width="5" height="24" rx="2" fill="currentColor" opacity="0.35"/>

  <!-- Right seat back -->
  <rect x="136" y="70" width="48" height="55" rx="10" fill="currentColor" opacity="0.5"/>
  <!-- Right seat cushion -->
  <rect x="134" y="120" width="52" height="22" rx="6" fill="currentColor" opacity="0.6"/>
  <!-- Right armrest -->
  <rect x="180" y="95" width="10" height="40" rx="5" fill="currentColor" opacity="0.4"/>
  <!-- Right legs -->
  <rect x="142" y="142" width="5" height="22" rx="2" fill="currentColor" opacity="0.3"/>
  <rect x="172" y="142" width="5" height="22" rx="2" fill="currentColor" opacity="0.3"/>

  <!-- Seat back stitching lines -->
  <line x1="30" y1="82" x2="50" y2="82" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
  <line x1="30" y1="96" x2="50" y2="96" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
  <line x1="88" y1="76" x2="112" y2="76" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
  <line x1="88" y1="90" x2="112" y2="90" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
  <line x1="150" y1="82" x2="170" y2="82" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
  <line x1="150" y1="96" x2="170" y2="96" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
</svg>