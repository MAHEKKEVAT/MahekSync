<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Left seat -->
  <rect x="18" y="80" width="52" height="60" rx="8" fill="currentColor" opacity="0.5"/>
  <rect x="18" y="70" width="52" height="18" rx="6" fill="currentColor" opacity="0.65"/>
  <!-- Left seat armrests -->
  <rect x="14" y="85" width="8" height="40" rx="4" fill="currentColor" opacity="0.4"/>
  <rect x="66" y="85" width="8" height="40" rx="4" fill="currentColor" opacity="0.4"/>
  <!-- Left seat legs -->
  <rect x="26" y="140" width="6" height="20" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="56" y="140" width="6" height="20" rx="2" fill="currentColor" opacity="0.35"/>
  <!-- Center seat (slightly forward) -->
  <rect x="74" y="72" width="52" height="65" rx="8" fill="currentColor" opacity="0.55"/>
  <rect x="74" y="62" width="52" height="18" rx="6" fill="currentColor" opacity="0.7"/>
  <!-- Center seat armrests -->
  <rect x="70" y="77" width="8" height="42" rx="4" fill="currentColor" opacity="0.45"/>
  <rect x="122" y="77" width="8" height="42" rx="4" fill="currentColor" opacity="0.45"/>
  <!-- Center seat legs -->
  <rect x="82" y="137" width="6" height="23" rx="2" fill="currentColor" opacity="0.4"/>
  <rect x="112" y="137" width="6" height="23" rx="2" fill="currentColor" opacity="0.4"/>
  <!-- Right seat -->
  <rect x="130" y="80" width="52" height="60" rx="8" fill="currentColor" opacity="0.5"/>
  <rect x="130" y="70" width="52" height="18" rx="6" fill="currentColor" opacity="0.65"/>
  <!-- Right seat armrests -->
  <rect x="126" y="85" width="8" height="40" rx="4" fill="currentColor" opacity="0.4"/>
  <rect x="178" y="85" width="8" height="40" rx="4" fill="currentColor" opacity="0.4"/>
  <!-- Right seat legs -->
  <rect x="138" y="140" width="6" height="20" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="168" y="140" width="6" height="20" rx="2" fill="currentColor" opacity="0.35"/>
  <!-- Seat cushion lines -->
  <line x1="28" y1="105" x2="60" y2="105" stroke="currentColor" stroke-width="2" opacity="0.2"/>
  <line x1="84" y1="100" x2="116" y2="100" stroke="currentColor" stroke-width="2" opacity="0.2"/>
  <line x1="140" y1="105" x2="172" y2="105" stroke="currentColor" stroke-width="2" opacity="0.2"/>
</svg>