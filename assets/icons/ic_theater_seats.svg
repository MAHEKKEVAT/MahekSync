<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Floor shadow -->
  <ellipse cx="100" cy="176" rx="68" ry="5" fill="currentColor" opacity="0.08"/>

  <!-- Background ambiance -->
  <rect x="10" y="50" width="180" height="100" rx="20" fill="currentColor" opacity="0.05"/>

  <!-- Floating platform — depth base -->
  <rect x="10" y="140" width="180" height="6" rx="3" fill="currentColor" opacity="0.12"/>
  <!-- Platform edge highlight -->
  <rect x="14" y="140" width="172" height="2" rx="1" fill="currentColor" opacity="0.08"/>

  <!-- ── LEFT SEAT ── -->
  <!-- Back — layer 1: base plush -->
  <rect x="14" y="62" width="50" height="58" rx="18" fill="currentColor" opacity="0.35"/>
  <!-- Back — layer 2: inner glass -->
  <rect x="18" y="66" width="42" height="50" rx="14" fill="currentColor" opacity="0.10"/>
  <!-- Cushion — layer 1: base -->
  <rect x="12" y="114" width="54" height="26" rx="12" fill="currentColor" opacity="0.45"/>
  <!-- Cushion — layer 2: highlight strip -->
  <rect x="18" y="116" width="42" height="6" rx="3" fill="currentColor" opacity="0.10"/>
  <!-- Cushion — layer 3: edge glow -->
  <rect x="16" y="114" width="46" height="3" rx="1.5" fill="currentColor" opacity="0.06"/>
  <!-- Armrest -->
  <rect x="6" y="86" width="14" height="46" rx="7" fill="currentColor" opacity="0.35"/>
  <!-- Armrest knob — metallic -->
  <circle cx="13" cy="86" r="8" fill="currentColor" opacity="0.28"/>
  <circle cx="13" cy="86" r="4" fill="currentColor" opacity="0.16"/>
  <!-- Legs -->
  <rect x="22" y="140" width="4" height="26" rx="2" fill="currentColor" opacity="0.22"/>
  <rect x="52" y="140" width="4" height="26" rx="2" fill="currentColor" opacity="0.22"/>
  <!-- Leg caps -->
  <rect x="20" y="164" width="8" height="3" rx="1.5" fill="currentColor" opacity="0.18"/>
  <rect x="50" y="164" width="8" height="3" rx="1.5" fill="currentColor" opacity="0.18"/>

  <!-- ── CENTER SEAT (taller) ── -->
  <!-- Back — layer 1 -->
  <rect x="72" y="54" width="56" height="64" rx="18" fill="currentColor" opacity="0.40"/>
  <!-- Back — layer 2: inner glass -->
  <rect x="76" y="58" width="48" height="56" rx="14" fill="currentColor" opacity="0.10"/>
  <!-- Cushion — layer 1 -->
  <rect x="70" y="112" width="60" height="28" rx="12" fill="currentColor" opacity="0.50"/>
  <!-- Cushion — layer 2: highlight -->
  <rect x="76" y="114" width="48" height="6" rx="3" fill="currentColor" opacity="0.10"/>
  <!-- Cushion — layer 3: edge glow -->
  <rect x="74" y="112" width="52" height="3" rx="1.5" fill="currentColor" opacity="0.06"/>
  <!-- Armrests -->
  <rect x="64" y="80" width="14" height="48" rx="7" fill="currentColor" opacity="0.38"/>
  <rect x="122" y="80" width="14" height="48" rx="7" fill="currentColor" opacity="0.38"/>
  <!-- Armrest knobs -->
  <circle cx="71" cy="80" r="8" fill="currentColor" opacity="0.30"/>
  <circle cx="71" cy="80" r="4" fill="currentColor" opacity="0.16"/>
  <circle cx="129" cy="80" r="8" fill="currentColor" opacity="0.30"/>
  <circle cx="129" cy="80" r="4" fill="currentColor" opacity="0.16"/>
  <!-- Legs -->
  <rect x="82" y="140" width="4" height="26" rx="2" fill="currentColor" opacity="0.25"/>
  <rect x="114" y="140" width="4" height="26" rx="2" fill="currentColor" opacity="0.25"/>
  <!-- Leg caps -->
  <rect x="80" y="164" width="8" height="3" rx="1.5" fill="currentColor" opacity="0.20"/>
  <rect x="112" y="164" width="8" height="3" rx="1.5" fill="currentColor" opacity="0.20"/>

  <!-- ── RIGHT SEAT ── -->
  <!-- Back — layer 1 -->
  <rect x="136" y="62" width="50" height="58" rx="18" fill="currentColor" opacity="0.35"/>
  <!-- Back — layer 2: inner glass -->
  <rect x="140" y="66" width="42" height="50" rx="14" fill="currentColor" opacity="0.10"/>
  <!-- Cushion — layer 1 -->
  <rect x="134" y="114" width="54" height="26" rx="12" fill="currentColor" opacity="0.45"/>
  <!-- Cushion — layer 2: highlight -->
  <rect x="140" y="116" width="42" height="6" rx="3" fill="currentColor" opacity="0.10"/>
  <!-- Cushion — layer 3: edge glow -->
  <rect x="138" y="114" width="46" height="3" rx="1.5" fill="currentColor" opacity="0.06"/>
  <!-- Armrest -->
  <rect x="180" y="86" width="14" height="46" rx="7" fill="currentColor" opacity="0.35"/>
  <!-- Armrest knob -->
  <circle cx="187" cy="86" r="8" fill="currentColor" opacity="0.28"/>
  <circle cx="187" cy="86" r="4" fill="currentColor" opacity="0.16"/>
  <!-- Legs -->
  <rect x="144" y="140" width="4" height="26" rx="2" fill="currentColor" opacity="0.22"/>
  <rect x="174" y="140" width="4" height="26" rx="2" fill="currentColor" opacity="0.22"/>
  <!-- Leg caps -->
  <rect x="142" y="164" width="8" height="3" rx="1.5" fill="currentColor" opacity="0.18"/>
  <rect x="172" y="164" width="8" height="3" rx="1.5" fill="currentColor" opacity="0.18"/>

  <!-- Seat back stitching — subtle horizontal lines -->
  <rect x="28" y="82" width="22" height="1.5" rx="0.75" fill="currentColor" opacity="0.08"/>
  <rect x="28" y="98" width="22" height="1.5" rx="0.75" fill="currentColor" opacity="0.08"/>
  <rect x="86" y="76" width="28" height="1.5" rx="0.75" fill="currentColor" opacity="0.08"/>
  <rect x="86" y="94" width="28" height="1.5" rx="0.75" fill="currentColor" opacity="0.08"/>
  <rect x="150" y="82" width="22" height="1.5" rx="0.75" fill="currentColor" opacity="0.08"/>
  <rect x="150" y="98" width="22" height="1.5" rx="0.75" fill="currentColor" opacity="0.08"/>

  <!-- Inter-seat ambient glow -->
  <ellipse cx="60" cy="100" rx="8" ry="20" fill="currentColor" opacity="0.04"/>
  <ellipse cx="140" cy="100" rx="8" ry="20" fill="currentColor" opacity="0.04"/>
</svg>
