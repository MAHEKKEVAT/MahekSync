<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Shadow under bucket -->
  <ellipse cx="100" cy="184" rx="50" ry="5" fill="currentColor" opacity="0.12"/>
  <!-- Bucket body -->
  <path d="M55 88 L70 180 L130 180 L145 88 Z" fill="currentColor" opacity="0.5"/>
  <!-- Bucket body inner highlight -->
  <path d="M58 90 L68 176 L80 176 L70 90 Z" fill="currentColor" opacity="0.08"/>
  <!-- Bucket rim -->
  <path d="M42 78 L158 78 L156 92 L44 92 Z" fill="currentColor" opacity="0.65" rx="4"/>
  <!-- Bucket rim highlight line -->
  <line x1="44" y1="80" x2="156" y2="80" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <!-- Bucket horizontal stripes -->
  <line x1="60" y1="112" x2="140" y2="112" stroke="currentColor" stroke-width="3" opacity="0.18"/>
  <line x1="63" y1="136" x2="137" y2="136" stroke="currentColor" stroke-width="3" opacity="0.16"/>
  <line x1="66" y1="160" x2="134" y2="160" stroke="currentColor" stroke-width="3" opacity="0.14"/>
  <!-- Bucket vertical stripes -->
  <path d="M78 88 L82 180" stroke="currentColor" stroke-width="2" opacity="0.12"/>
  <path d="M100 88 L100 180" stroke="currentColor" stroke-width="2" opacity="0.12"/>
  <path d="M122 88 L118 180" stroke="currentColor" stroke-width="2" opacity="0.12"/>
  <!-- Large popcorn pieces (irregular shapes) -->
  <ellipse cx="62" cy="62" rx="18" ry="16" fill="currentColor" opacity="0.55" transform="rotate(-10 62 62)"/>
  <ellipse cx="92" cy="48" rx="20" ry="18" fill="currentColor" opacity="0.65" transform="rotate(5 92 48)"/>
  <ellipse cx="122" cy="52" rx="19" ry="17" fill="currentColor" opacity="0.6" transform="rotate(-8 122 52)"/>
  <ellipse cx="148" cy="64" rx="16" ry="14" fill="currentColor" opacity="0.5" transform="rotate(12 148 64)"/>
  <!-- Medium popcorn pieces -->
  <ellipse cx="75" cy="42" rx="14" ry="12" fill="currentColor" opacity="0.48" transform="rotate(15 75 42)"/>
  <ellipse cx="108" cy="36" rx="15" ry="13" fill="currentColor" opacity="0.52" transform="rotate(-6 108 36)"/>
  <ellipse cx="135" cy="40" rx="13" ry="11" fill="currentColor" opacity="0.42" transform="rotate(8 135 40)"/>
  <!-- Small popcorn pieces on top -->
  <circle cx="50" cy="52" r="10" fill="currentColor" opacity="0.38"/>
  <circle cx="155" cy="56" r="9" fill="currentColor" opacity="0.32"/>
  <circle cx="100" cy="30" r="10" fill="currentColor" opacity="0.38"/>
  <circle cx="82" cy="28" r="7" fill="currentColor" opacity="0.3"/>
  <circle cx="120" cy="28" r="8" fill="currentColor" opacity="0.32"/>
  <!-- Kernel detail dots (texture) -->
  <circle cx="78" cy="50" r="3" fill="currentColor" opacity="0.2"/>
  <circle cx="115" cy="44" r="2.5" fill="currentColor" opacity="0.18"/>
  <circle cx="92" cy="60" r="2" fill="currentColor" opacity="0.15"/>
  <circle cx="132" cy="58" r="2.5" fill="currentColor" opacity="0.16"/>
  <circle cx="58" cy="68" r="2" fill="currentColor" opacity="0.14"/>
  <!-- Highlight glints on popcorn -->
  <circle cx="88" cy="42" r="3.5" fill="currentColor" opacity="0.12"/>
  <circle cx="118" cy="46" r="3" fill="currentColor" opacity="0.1"/>
  <circle cx="68" cy="56" r="2.5" fill="currentColor" opacity="0.1"/>
  <circle cx="142" cy="58" r="2" fill="currentColor" opacity="0.08"/>
</svg>
