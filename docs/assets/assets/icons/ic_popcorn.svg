<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Floor shadow -->
  <ellipse cx="100" cy="188" rx="46" ry="5" fill="currentColor" opacity="0.08"/>

  <!-- Ambient glow behind popcorn cluster -->
  <ellipse cx="100" cy="48" rx="60" ry="36" fill="currentColor" opacity="0.06"/>

  <!-- Bucket body — layer 1: base frosted acrylic -->
  <path d="M56 84 L70 182 L130 182 L144 84 Z" fill="currentColor" opacity="0.35"/>
  <!-- Bucket body — layer 2: left glass highlight -->
  <path d="M58 86 L64 178 L76 178 L70 86 Z" fill="currentColor" opacity="0.08"/>
  <!-- Bucket body — layer 3: center vertical glow band -->
  <path d="M88 84 L92 182 L108 182 L104 84 Z" fill="currentColor" opacity="0.06"/>

  <!-- Bucket vertical grooves — soft texture -->
  <path d="M78 84 L82 182" stroke="currentColor" stroke-width="1.5" opacity="0.08"/>
  <path d="M100 84 L100 182" stroke="currentColor" stroke-width="1.5" opacity="0.08"/>
  <path d="M122 84 L118 182" stroke="currentColor" stroke-width="1.5" opacity="0.08"/>

  <!-- Bucket rim — thick premium -->
  <rect x="42" y="74" width="116" height="16" rx="8" fill="currentColor" opacity="0.50"/>
  <!-- Rim highlight — top edge -->
  <rect x="46" y="76" width="108" height="4" rx="2" fill="currentColor" opacity="0.10"/>
  <!-- Rim glass reflection -->
  <rect x="50" y="80" width="100" height="3" rx="1.5" fill="currentColor" opacity="0.06"/>

  <!-- Popcorn layer 1 — base large puffy shapes -->
  <ellipse cx="62" cy="58" rx="20" ry="18" fill="currentColor" opacity="0.40" transform="rotate(-10 62 58)"/>
  <ellipse cx="100" cy="44" rx="24" ry="20" fill="currentColor" opacity="0.45" transform="rotate(5 100 44)"/>
  <ellipse cx="138" cy="56" rx="20" ry="18" fill="currentColor" opacity="0.40" transform="rotate(8 138 56)"/>

  <!-- Popcorn layer 2 — mid depth -->
  <ellipse cx="76" cy="38" rx="16" ry="14" fill="currentColor" opacity="0.45" transform="rotate(12 76 38)"/>
  <ellipse cx="120" cy="34" rx="17" ry="15" fill="currentColor" opacity="0.48" transform="rotate(-6 120 34)"/>
  <ellipse cx="150" cy="48" rx="14" ry="12" fill="currentColor" opacity="0.40" transform="rotate(10 150 48)"/>

  <!-- Popcorn layer 3 — top floating pieces -->
  <circle cx="50" cy="48" r="11" fill="currentColor" opacity="0.35"/>
  <circle cx="154" cy="52" r="10" fill="currentColor" opacity="0.30"/>
  <circle cx="100" cy="26" r="11" fill="currentColor" opacity="0.35"/>
  <circle cx="80" cy="24" r="8" fill="currentColor" opacity="0.28"/>

  <!-- Popcorn layer 4 — tiny floating accents -->
  <circle cx="66" cy="30" r="5" fill="currentColor" opacity="0.22"/>
  <circle cx="136" cy="30" r="5" fill="currentColor" opacity="0.22"/>

  <!-- Popcorn glossy highlights -->
  <circle cx="86" cy="38" r="4.5" fill="currentColor" opacity="0.10"/>
  <circle cx="120" cy="40" r="4" fill="currentColor" opacity="0.08"/>
  <circle cx="66" cy="52" r="3.5" fill="currentColor" opacity="0.08"/>

  <!-- Popcorn ambient glow — soft halo -->
  <ellipse cx="100" cy="40" rx="40" ry="22" fill="currentColor" opacity="0.05"/>
</svg>
