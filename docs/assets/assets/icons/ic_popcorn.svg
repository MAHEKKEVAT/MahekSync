<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Bucket body -->
  <path d="M55 88 L70 180 L130 180 L145 88 Z" fill="currentColor" opacity="0.5"/>
  <!-- Bucket rim -->
  <path d="M44 80 L156 80 L154 92 L46 92 Z" fill="currentColor" opacity="0.65" rx="4"/>
  <!-- Bucket horizontal stripes -->
  <line x1="62" y1="110" x2="138" y2="110" stroke="currentColor" stroke-width="3" opacity="0.2"/>
  <line x1="65" y1="135" x2="135" y2="135" stroke="currentColor" stroke-width="3" opacity="0.2"/>
  <line x1="67" y1="160" x2="133" y2="160" stroke="currentColor" stroke-width="3" opacity="0.15"/>
  <!-- Bucket vertical stripes -->
  <path d="M78 88 L82 180" stroke="currentColor" stroke-width="2" opacity="0.15"/>
  <path d="M100 88 L100 180" stroke="currentColor" stroke-width="2" opacity="0.15"/>
  <path d="M122 88 L118 180" stroke="currentColor" stroke-width="2" opacity="0.15"/>
  <!-- Large popcorn pieces -->
  <circle cx="62" cy="62" r="18" fill="currentColor" opacity="0.6"/>
  <circle cx="92" cy="48" r="20" fill="currentColor" opacity="0.7"/>
  <circle cx="122" cy="52" r="19" fill="currentColor" opacity="0.65"/>
  <circle cx="148" cy="64" r="16" fill="currentColor" opacity="0.55"/>
  <!-- Medium popcorn pieces -->
  <circle cx="75" cy="44" r="14" fill="currentColor" opacity="0.5"/>
  <circle cx="108" cy="38" r="15" fill="currentColor" opacity="0.55"/>
  <circle cx="135" cy="42" r="13" fill="currentColor" opacity="0.45"/>
  <!-- Small popcorn pieces on top -->
  <circle cx="52" cy="50" r="10" fill="currentColor" opacity="0.4"/>
  <circle cx="155" cy="54" r="9" fill="currentColor" opacity="0.35"/>
  <circle cx="100" cy="32" r="10" fill="currentColor" opacity="0.4"/>
  <!-- Highlight dots -->
  <circle cx="88" cy="42" r="4" fill="currentColor" opacity="0.25"/>
  <circle cx="118" cy="46" r="3" fill="currentColor" opacity="0.2"/>
  <circle cx="68" cy="56" r="3" fill="currentColor" opacity="0.18"/>
</svg>