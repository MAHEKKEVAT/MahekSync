<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Ticket body -->
  <rect x="18" y="68" width="164" height="64" rx="8" fill="currentColor" opacity="0.5"/>
  <!-- Semicircle notches at tear line -->
  <circle cx="130" cy="68" r="12" fill="currentColor" opacity="0.12"/>
  <circle cx="130" cy="132" r="12" fill="currentColor" opacity="0.12"/>
  <!-- Tear line (dotted) -->
  <line x1="130" y1="80" x2="130" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.25"/>
  <!-- Top border accent -->
  <rect x="18" y="64" width="164" height="8" rx="4" fill="currentColor" opacity="0.35"/>
  <!-- Bottom border accent -->
  <rect x="18" y="128" width="164" height="8" rx="4" fill="currentColor" opacity="0.35"/>
  <!-- Left section: ADMIT ONE -->
  <rect x="28" y="80" width="90" height="40" rx="5" fill="currentColor" opacity="0.18"/>
  <text x="40" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="currentColor" opacity="0.45" letter-spacing="2">ADMIT</text>
  <text x="48" y="116" font-family="sans-serif" font-size="14" font-weight="bold" fill="currentColor" opacity="0.45" letter-spacing="2">ONE</text>
  <!-- Small star decorations -->
  <polygon points="98,90 100,96 106,96 101,100 103,106 98,102 93,106 95,100 90,96 96,96" fill="currentColor" opacity="0.2"/>
  <!-- Right stub: number -->
  <rect x="138" y="78" width="34" height="44" rx="4" fill="currentColor" opacity="0.18"/>
  <text x="144" y="107" font-family="sans-serif" font-size="22" font-weight="bold" fill="currentColor" opacity="0.4">#1</text>
  <!-- Barcode lines on stub -->
  <rect x="142" y="114" width="2" height="8" rx="1" fill="currentColor" opacity="0.2"/>
  <rect x="146" y="114" width="1" height="8" rx="0.5" fill="currentColor" opacity="0.15"/>
  <rect x="149" y="114" width="3" height="8" rx="1" fill="currentColor" opacity="0.2"/>
  <rect x="154" y="114" width="1" height="8" rx="0.5" fill="currentColor" opacity="0.15"/>
  <rect x="157" y="114" width="2" height="8" rx="1" fill="currentColor" opacity="0.2"/>
  <rect x="161" y="114" width="1" height="8" rx="0.5" fill="currentColor" opacity="0.15"/>
  <rect x="164" y="114" width="2" height="8" rx="1" fill="currentColor" opacity="0.18"/>
</svg>